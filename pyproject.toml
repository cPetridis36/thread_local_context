[project]
name = "thread-local-context"
version = "0.1.0"
description = "A carrier object that propagates request-scoped values across threads using threading.local with explicit snapshot and restore for child tasks."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
